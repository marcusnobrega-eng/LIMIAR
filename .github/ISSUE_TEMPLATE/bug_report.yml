name: Correction
description: Report incorrect or broken behavior.
title: "[Correction]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is wrong and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the URL, date, station, language, device, and steps when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, console output, or affected data files.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable conditions that will confirm the correction.
    validations:
      required: true
