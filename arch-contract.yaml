version: 1
project:
  name: limiar-web

layers:
  - name: application
    match: [app.js]
  - name: observability
    match: [observability.js]
  - name: office
    match: [office-charts.js]

ruleset:
  application:
    mayDependOn: [observability, office]
  observability:
    mayDependOn: []
  office:
    mayDependOn: []

expectations:
  - name: observability-must-not-import-application
    expect:
      layer: observability
    to:
      notDependOnPaths: [app.js]

agent:
  updateDocs: [AGENTS.md]
